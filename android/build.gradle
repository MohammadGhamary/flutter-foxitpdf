group 'com.foxit.flutterfoxitpdf'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.4'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1'
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.foxit.flutterfoxitpdf'

    compileSdk 33

    defaultConfig {
        minSdk 19
        versionName "9.1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        // --- native crypto module -------------------------------------
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        // -----------------------------------------------------------------
    }

    // --- native crypto module: point Gradle at the CMake script ---------
    // NOTE: unlike newer AGP versions, 3.5.4 does not support specifying a
    // "version" here -- the CMake binary used is whatever is installed via
    // SDK Manager (Tools > SDK Manager > SDK Tools > CMake). Make sure
    // something >= 3.18 is installed, since mbedTLS requires it.
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    // ----------------------------------------------------------------------

    // --- release hardening: obfuscate/shrink this library's own code ----
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // ----------------------------------------------------------------------

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation(name: 'FoxitRDK', ext: 'aar')
    implementation(name: 'FoxitRDKUIExtensions', ext: 'aar')
    implementation 'com.edmodo:cropper:1.0.1'
    implementation 'com.microsoft.identity.client:msal:2.2.0'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    implementation "io.reactivex.rxjava2:rxjava:2.2.16"
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.64'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.64'
    implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'
}